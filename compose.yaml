x-app-runtime-environment: &app-runtime-environment
    BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
    REVERB_APP_ID: ${REVERB_APP_ID:-bid-crm-local}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-bid-crm-local-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-bid-crm-local-secret}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
    MOCK_CRM_URL: http://nginx

services:
    node:
        build:
            context: .
            dockerfile: Dockerfile.node
        profiles: ['frontend']
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
            - node_modules:/var/www/html/node_modules
        ports:
            - '5173:5173'
        command: ['sleep', 'infinity']

    php:
        container_name: ${APP_NAME}_app
        user: '${APP_UID:-1000}:${APP_GID:-1000}'
        group_add:
            - '${DOCKER_GID:?Set DOCKER_GID to the group ID of /var/run/docker.sock}'
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www/html
        environment:
            <<: *app-runtime-environment
            TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
            WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
        volumes:
            - ./:/var/www/html
            - /var/run/docker.sock:/var/run/docker.sock
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            reverb:
                condition: service_started

    worker:
        container_name: ${APP_NAME}_worker
        user: '${APP_UID:-1000}:${APP_GID:-1000}'
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www/html
        command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
        environment: *app-runtime-environment
        volumes:
            - ./:/var/www/html
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            reverb:
                condition: service_started

    scheduler:
        container_name: ${APP_NAME}_scheduler
        user: '${APP_UID:-1000}:${APP_GID:-1000}'
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www/html
        command: php artisan schedule:work
        environment: *app-runtime-environment
        volumes:
            - ./:/var/www/html
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            reverb:
                condition: service_started

    reverb:
        container_name: ${APP_NAME}_reverb
        user: '${APP_UID:-1000}:${APP_GID:-1000}'
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www/html
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        environment: *app-runtime-environment
        ports:
            - '${REVERB_SERVER_PORT:-8080}:8080'
        volumes:
            - ./:/var/www/html

    nginx:
        container_name: ${APP_NAME}_nginx
        image: nginx:alpine
        ports:
            - '8000:80'
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    db:
        image: postgres:17-alpine
        container_name: ${APP_NAME}_db
        environment:
            POSTGRES_DB: ${DB_DATABASE:-bid_crm}
            POSTGRES_USER: ${DB_USERNAME:-user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: ${APP_NAME}_redis
        ports:
            - '${REDIS_HOST_PORT:-6379}:6379'
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgres_data:
    redis_data:
    node_modules:
