x-app-environment: &app-environment
    APP_ENV: production
    APP_DEBUG: "false"
    APP_NAME: ${APP_NAME:-Deals CRM}
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
    APP_URL: ${APP_URL:?Set APP_URL in .env.production}
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
    DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    REDIS_QUEUE_RETRY_AFTER: 120
    SESSION_SECURE_COOKIE: "true"
    BROADCAST_CONNECTION: reverb
    WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:?Set WEBHOOK_TOKEN in .env.production}
    REVERB_APP_ID: ${REVERB_APP_ID:?Set REVERB_APP_ID in .env.production}
    REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env.production}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env.production}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
    MOCK_CRM_URL: http://nginx:8080

services:
    php:
        build:
            context: .
            dockerfile: Dockerfile.production
            target: php-app
            args:
                VITE_APP_NAME: ${VITE_APP_NAME:-Deals CRM}
                VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env.production}
                VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST in .env.production}
                VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
                VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
        env_file:
            - .env.production
        environment: *app-environment
        user: "82:82"
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=64m
            - /var/run:rw,nosuid,nodev,noexec,uid=82,gid=82,mode=755,size=16m
        volumes:
            - app_storage:/var/www/html/storage
            - app_bootstrap_cache:/var/www/html/bootstrap/cache
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - app

    worker:
        build:
            context: .
            dockerfile: Dockerfile.production
            target: php-app
            args:
                VITE_APP_NAME: ${VITE_APP_NAME:-Deals CRM}
                VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env.production}
                VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST in .env.production}
                VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
                VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
        command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
        env_file:
            - .env.production
        environment: *app-environment
        user: "82:82"
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=64m
        volumes:
            - app_storage:/var/www/html/storage
            - app_bootstrap_cache:/var/www/html/bootstrap/cache
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            reverb:
                condition: service_started
        networks:
            - app

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile.production
            target: php-app
            args:
                VITE_APP_NAME: ${VITE_APP_NAME:-Deals CRM}
                VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env.production}
                VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST in .env.production}
                VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
                VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
        command: php artisan schedule:work
        env_file:
            - .env.production
        environment: *app-environment
        user: "82:82"
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=64m
        volumes:
            - app_storage:/var/www/html/storage
            - app_bootstrap_cache:/var/www/html/bootstrap/cache
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - app

    reverb:
        build:
            context: .
            dockerfile: Dockerfile.production
            target: php-app
            args:
                VITE_APP_NAME: ${VITE_APP_NAME:-Deals CRM}
                VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env.production}
                VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST in .env.production}
                VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
                VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        env_file:
            - .env.production
        environment: *app-environment
        user: "82:82"
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=64m
        volumes:
            - app_storage:/var/www/html/storage
            - app_bootstrap_cache:/var/www/html/bootstrap/cache
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        restart: unless-stopped
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - app

    nginx:
        build:
            context: .
            dockerfile: Dockerfile.production
            target: nginx
            args:
                VITE_APP_NAME: ${VITE_APP_NAME:-Deals CRM}
                VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env.production}
                VITE_REVERB_HOST: ${VITE_REVERB_HOST:?Set VITE_REVERB_HOST in .env.production}
                VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
                VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
        ports:
            - "127.0.0.1:${HTTP_PORT:-8088}:8080"
        read_only: true
        tmpfs:
            - /tmp:rw,nosuid,nodev,noexec,size=32m
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        restart: unless-stopped
        depends_on:
            php:
                condition: service_started
            reverb:
                condition: service_started
        networks:
            - app
            - edge

    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
            POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
            interval: 5s
            timeout: 5s
            retries: 10
        security_opt:
            - no-new-privileges:true
        restart: unless-stopped
        networks:
            - app

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}"]
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
            interval: 5s
            timeout: 3s
            retries: 10
        security_opt:
            - no-new-privileges:true
        restart: unless-stopped
        networks:
            - app

volumes:
    app_storage:
    app_bootstrap_cache:
    postgres_data:
    redis_data:

networks:
    app:
        internal: true
    edge:
        internal: true
